name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      app_name:
        required: true
      icon_base64:
        required: true
      job_id:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode Icon (PNG base64 -> mipmap)
        run: |
          echo "${{ github.event.inputs.icon_base64 }}" | base64 -d > /tmp/ic_launcher.png
          mkdir -p app/src/main/res/mipmap-hdpi
          cp /tmp/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Replace URL in MainActivity (auto-find)
        run: |
          set -e
          URL="${{ github.event.inputs.url }}"
          FILE=$(find app/src/main/java -type f -name "MainActivity.java" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "MainActivity.java not found!"
            ls -R app/src/main/java || true
            exit 1
          fi
          echo "MainActivity: $FILE"
          sed -i "s|{{URL_PLACEHOLDER}}|$URL|g" "$FILE"

      - name: Set App Name
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          sed -i "s|{{APP_NAME}}|$NAME|g" app/src/main/res/values/strings.xml

      - name: Grant execute for gradlew
        run: chmod +x gradlew

      - name: Build APK Release
        run: ./gradlew assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-apk-${{ github.event.inputs.job_id }}
          path: app/build/outputs/apk/release/*.apk

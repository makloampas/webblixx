name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      app_name:
        required: true
      icon_base64:
        required: true
      job_id:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode Icon
        run: |
          echo "${{ github.event.inputs.icon_base64 }}" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Replace URL
        run: |
          sed -i "s|{{URL_PLACEHOLDER}}|${{ github.event.inputs.url }}|g" app/src/main/java/com/lixx/webapp/MainActivity.java

      - name: Set App Name
        run: |
          sed -i "s|WebApp|${{ github.event.inputs.app_name }}|g" app/src/main/res/values/strings.xml

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-apk-${{ github.event.inputs.job_id }}
          path: android/app/build/outputs/apk/release/*.apk
